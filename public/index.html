<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightfall - TikTok High Quality Uploader</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 400px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .btn:disabled {
            background-color: #484f58;
            cursor: not-allowed;
        }
        #statusText {
            margin-top: 20px;
            font-size: 13px;
            color: #f0883e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NIGHTFALL UPLOADER</h1>
        <p>نظام ضغط ومعالجة الفيديوهات لرفعها بجودة خيالية على تيك توك بدون VPN</p>
        
        <input type="file" id="videoFile" accept="video/*" style="display: none;">
        <button class="btn" id="processBtn">اختر الفيديو وابدأ المعالجة 🚀</button>
        
        <div id="statusText">جاهز للعمل...</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const processBtn = document.getElementById('processBtn');
        const videoFileInput = document.getElementById('videoFile');
        const statusText = document.getElementById('statusText');

        processBtn.addEventListener('click', () => {
            videoFileInput.click();
        });

        videoFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const inputPath = file.path; // مسار الملف الحقيقي على الجهاز

            try {
                processBtn.disabled = true;
                statusText.textContent = 'جاري ضغط ومعالجة الفيديو بالترميز الخارق... ⏳';

                // إرسال المسار للـ main.js لتتم المعالجة عبر FFmpeg
                const outputPath = await ipcRenderer.invoke('process-video-local', inputPath);

                if (outputPath) {
                    statusText.textContent = 'تمت المعالجة وحفظ المقطع في مجلد التنزيلات بنجاح! 🎉';
                    
                    // فتح استوديو تيك توك تلقائياً لتعمل إضافة TikoSystem وتستلم المقطع
                    setTimeout(() => {
                        window.open('https://www.tiktok.com/tiktokstudio/upload', '_blank');
                    }, 1500);
                }
            } catch (error) {
                console.error(error);
                statusText.textContent = 'حدث خطأ أثناء المعالجة: ' + error;
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
